server:
  port: 8080

spring:
  application:
    name: saccos-auth-service

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/auth}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:postgres}

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:admin}
    password: ${RABBITMQ_PASSWORD:password}

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

# JWT — CHANGE THE SECRET IN PRODUCTION (min 64 chars)
jwt:
  secret: ${JWT_SECRET:SaccosSecretKeyForJwtTokenGenerationMustBeAtLeast64CharactersLongForHS512Algorithm!}
  access-token-expiry-minutes: ${JWT_ACCESS_EXPIRY_MINUTES:60}
  refresh-token-expiry-days: ${JWT_REFRESH_EXPIRY_DAYS:7}

security:
  max-failed-attempts: ${MAX_FAILED_ATTEMPTS:5}
  lockout-minutes: ${LOCKOUT_MINUTES:30}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

logging:
  level:
    com.reimagineafrica.auth: INFO
    org.springframework.security: WARN
